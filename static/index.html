<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kumam's AI News Console</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div id="aurora" aria-hidden="true"></div>
  <div id="radar-sweep" aria-hidden="true"></div>

  <header class="site-header sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
      <h1 class="wordmark flex items-center gap-2.5">
        <span class="pulse-dot" aria-hidden="true"></span>
        Kumam's AI News Console
      </h1>

      <nav id="tabs" class="flex gap-1 ml-2">
        <button data-tab="news" class="tab-btn">AI News</button>
        <button data-tab="microsoft" class="tab-btn">Microsoft</button>
        <button data-tab="repos" class="tab-btn">Trending Repos</button>
        <button data-tab="use_cases" class="tab-btn">Use Cases</button>
      </nav>

      <div class="flex-1"></div>

      <input
        id="search"
        type="search"
        placeholder="Search title or gist…"
        class="search-input"
      />

      <button id="refresh-btn" class="refresh-btn">
        <svg id="refresh-icon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        Refresh
      </button>

      <span id="last-updated" class="last-updated"></span>
    </div>

    <div id="chips" class="max-w-7xl mx-auto px-4 pb-3 flex flex-wrap gap-2"></div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <div id="empty-state" class="hidden text-center py-20">
      <p class="text-lg text-zinc-300">No items yet.</p>
      <p class="text-sm mt-1 text-zinc-500">Click Refresh to fetch the latest news.</p>
    </div>
    <div id="cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
  </main>

  <footer class="site-footer">
    <div class="max-w-7xl mx-auto px-4 py-5 text-center">
      Built by Manish Kumar —
      <a href="https://www.linkedin.com/in/kumam/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </div>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
